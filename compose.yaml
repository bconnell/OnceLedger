services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onceledger
      POSTGRES_USER: onceledger
      POSTGRES_PASSWORD: onceledger_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onceledger -d onceledger"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"
volumes:
  postgres_data:
